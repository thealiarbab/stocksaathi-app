# Ops watcher: error intake + one-minute pulse. Separate from edge/front-door
# (the unfinished failover Worker) and from the site's own domain on purpose:
# it must keep working when the site, Vercel or the database is down.
#
# Deploy:   npx wrangler deploy            (from app/edge/ops-watch/)
# Storage:  npx wrangler d1 execute ops-watch --remote --file schema.sql
# Secrets:  OPS_SECRET (shared with the site's OPS_WATCH_SECRET; the database
#           holds only its SHA-256), SUPABASE_ANON_KEY (the public key),
#           OPS_MAIL_TO (where alerts go). Optional RESEND_API_KEY lets alerts
#           go out even when Vercel is down. The pulse does nothing until the
#           first three are set.
#           ROBOT_PASSWORD: the journey robot's test account. Without it the
#           robot does nothing.
#           AGENT_FIRE_URL + AGENT_FIRE_TOKEN: the start address of the ops
#           agent and its token. Without them the judge still decides and
#           records, and mails that it could not start anything.
# Storage changes: run the schema file BEFORE deploying code that uses a new
#           table (it is safe to re-run).
# Waking is off until switched on:  POST /admin {"op":"gate","paused":false}
# Tests:    npm test

name = "stocksaathi-ops-watch"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true
preview_urls = false

[triggers]
# Every minute: the pulse. Minute 4 of every ten: the journey robot; minute 5:
# its second try when a step failed.
crons = ["* * * * *", "4-59/10 * * * *", "5-59/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ops-watch"
database_id = "275b7535-b2cf-492f-8da3-9a27db561d06"

[vars]
SITE_URL = "https://stocksaathi.co.in"
SUPABASE_URL = "https://hwlmwraowcylxzdpumca.supabase.co"
OPS_MAIL_FROM = "StockSaathi Ops <orders@stocksaathi.co.in>"
# The robot's permanent test account (marked in ops_test_accounts; its
# password is the secret ROBOT_PASSWORD and exists nowhere else).
ROBOT_EMAIL = "ops-robot@stocksaathi.co.in"

# Reflexes (src/reflex.js) are tell-only. If the owner ever asks for the
# "put the previous build back" reflex to act, it needs a Vercel token here
# as a secret: `npx wrangler secret put VERCEL_TOKEN`. Not set, not needed
# and not asked for while reflexes only tell.

[observability]
enabled = true
